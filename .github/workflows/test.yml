name: Test

on:
  workflow_call:

# Least-privilege: the gate only reads the repo. Keep OIDC/environment OUT of here.
permissions:
  contents: read

jobs:
  gate:
    name: lint + types + tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # The orphan-sweep tests exercise `ps` portability (GNU vs BSD, -ww
          # truncation), so at least one macOS runner is load-bearing, not a nicety.
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs repository code (tests, scripts, a build). It never pushes,
          # so it has no use for the checkout token beyond the clone itself.
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # One entry point, shared with contributors: CONTRIBUTING.md#the-gate documents
      # this exact command, so a local green run means a green run here. Add steps to
      # the script, not to this file.
      - name: Gate
        run: ./scripts/check.sh
